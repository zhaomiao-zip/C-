<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C 语言期中复习工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='%23F5F6F3' stroke='%23B23A2B' stroke-width='2'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23B23A2B'%3EC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#" data-view="today" aria-label="回到今日">
    <span class="brand-mark" aria-hidden="true">C</span>
    <span class="brand-text">语言复习</span>
  </a>
  <nav class="tabs" role="tablist" aria-label="主导航">
    <button class="tab is-active" role="tab" aria-selected="true" data-view="today">今日</button>
    <button class="tab" role="tab" aria-selected="false" data-view="learn">知识</button>
    <button class="tab" role="tab" aria-selected="false" data-view="practice">练习</button>
    <button class="tab" role="tab" aria-selected="false" data-view="code">编程</button>
  </nav>
  <div class="topbar-meta">
    <span id="exam-countdown">—</span>
    <span class="meta-rule" aria-hidden="true"></span>
    <span id="progress-text" class="tabular">0 / 0</span>
  </div>
</header>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="章节与题目导航"></aside>
  <main class="main" id="view" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="stamp" id="stamp" aria-hidden="true">通过</div>

<script src="data.js"></script>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
